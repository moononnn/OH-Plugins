compatibility:
  minAppVersion: 0.1.0
trust: full-access
permissions:
  - 读取会话上下文并调用模型识图/配图
  - 可选：开启方言功能时写入对应助手的人格文件（默认关闭，需手动开启）
  - 发起网络请求（允许所有主机）
  - 读写插件自身数据（图库/标签/偏好）
  - 提供页面、工具、路由与扩展
contributions:
  - tools
  - page
  - routes
  - extensions

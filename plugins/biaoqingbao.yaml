schemaVersion: 1
id: biaoqingbao
name: 表情包
publisher: moononnn
author: moononnn & 小花
version: 0.27.2
description: 让助手在回复中根据语境自然使用表情包。支持批量导入、AI 识图自动打标签、语义检索、配图频率控制和偏好记忆；可给不同助手配不同方言口音。
license: MIT
categories:
  - 聊天
keywords:
